<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Countdown to October 14</title>
<style>
  :root{
    --gold:#e8b84b;
    --gold-light:#ffe6a8;
    --maroon:#5a0a12;
    --maroon-deep:#3a0510;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    min-height:100%;
    font-family:'Segoe UI', Arial, sans-serif;
    background:#1a0508;
  }
  .page{
    position:relative;
    min-height:100vh;
    width:100%;
    background-image:url('assets/phoenix-bg.png');
    background-size:cover;
    background-position:center top;
    background-repeat:no-repeat;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding: 6vh 5vw 6vh;
    overflow-x:hidden;
  }
  .overlay{
    position:absolute;
    inset:0;
    background:linear-gradient(180deg, rgba(30,3,8,0.35) 0%, rgba(30,3,8,0.15) 35%, rgba(20,2,6,0.55) 70%, rgba(15,1,4,0.75) 100%);
    pointer-events:none;
  }
  .content{
    position:relative;
    z-index:2;
    width:100%;
    max-width:520px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }

  h1{
    font-size:clamp(1.5rem, 5vw, 2.3rem);
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--gold-light);
    text-shadow: 0 0 20px rgba(0,0,0,0.85), 0 2px 4px rgba(0,0,0,0.9);
    margin-bottom:.2em;
    font-weight:700;
  }
  .subtitle{
    color:#ffe9c7;
    font-size:clamp(0.85rem, 2.5vw, 1rem);
    letter-spacing:1.5px;
    margin-bottom:5vh;
    text-shadow: 0 1px 6px rgba(0,0,0,0.9);
  }

  /* Temple arch countdown units */
  .timer{
    display:flex;
    gap:clamp(8px, 2.5vw, 18px);
    justify-content:center;
    flex-wrap:wrap;
    margin-top:auto;
  }
  .unit{
    position:relative;
    width:clamp(64px, 18vw, 92px);
    padding-top:clamp(22px, 6vw, 30px);
  }
  .temple-shape{
    background:linear-gradient(180deg, var(--maroon) 0%, var(--maroon-deep) 100%);
    border:2px solid var(--gold);
    border-radius: 50% 50% 8px 8px / 35% 35% 8px 8px;
    box-shadow: 0 0 18px rgba(0,0,0,0.6), inset 0 0 12px rgba(232,184,75,0.15);
    padding: clamp(14px,4vw,20px) 4px clamp(10px,3vw,14px);
    position:relative;
  }
  .temple-shape::before{
    content:'';
    position:absolute;
    top:-10px;
    left:50%;
    transform:translateX(-50%);
    width:8px;
    height:8px;
    background:var(--gold);
    border-radius:50%;
    box-shadow: 0 0 8px var(--gold);
  }
  .temple-shape::after{
    content:'';
    position:absolute;
    bottom:6px;
    left:8%;
    right:8%;
    height:1px;
    background:linear-gradient(90deg, transparent, var(--gold), transparent);
    opacity:.6;
  }
  .num{
    font-size:clamp(1.4rem, 5.5vw, 2.1rem);
    font-weight:700;
    color:var(--gold-light);
    text-shadow:0 0 12px rgba(232,184,75,0.55);
    font-variant-numeric: tabular-nums;
    display:block;
  }
  .label{
    margin-top:8px;
    font-size:.65rem;
    letter-spacing:2px;
    text-transform:uppercase;
    color:#f1d9a8;
    text-shadow: 0 1px 4px rgba(0,0,0,0.9);
  }

  .target-date{
    margin-top:2.5em;
    font-size:.85rem;
    color:#f5deb0;
    letter-spacing:1px;
    text-shadow: 0 1px 6px rgba(0,0,0,0.9);
  }

  .cta-btn{
    margin-top:2.2em;
    padding: 14px 42px;
    font-size:clamp(0.85rem, 2.5vw, 1rem);
    letter-spacing:3px;
    text-transform:uppercase;
    font-weight:700;
    color:var(--maroon-deep);
    background:linear-gradient(180deg, var(--gold-light), var(--gold));
    border:2px solid #fff3d6;
    border-radius:30px;
    cursor:pointer;
    box-shadow: 0 0 20px rgba(232,184,75,0.55), 0 4px 12px rgba(0,0,0,0.5);
    transition: transform .2s ease, box-shadow .2s ease;
  }
  .cta-btn:hover{
    transform:translateY(-2px) scale(1.03);
    box-shadow: 0 0 30px rgba(232,184,75,0.8), 0 6px 16px rgba(0,0,0,0.55);
  }
  .cta-btn:active{
    transform:translateY(0) scale(0.98);
  }

  .done{
    font-size:clamp(1.3rem,4vw,2rem);
    color:var(--gold-light);
    text-shadow:0 0 24px rgba(232,184,75,0.7);
  }

  @media (max-width: 420px){
    .page{ padding: 5vh 4vw 5vh; }
    .timer{ gap:8px; }
  }
</style>
</head>
<body>

<div class="page">
  <div class="overlay"></div>
  <div class="content">
    <h1>Rise of the Moment</h1>
    <div class="subtitle">Countdown to October 14 &middot; 10:30 AM</div>

    <div class="timer" id="timer">
      <div class="unit">
        <div class="temple-shape">
          <span class="num" id="days">00</span>
        </div>
        <div class="label">Days</div>
      </div>
      <div class="unit">
        <div class="temple-shape">
          <span class="num" id="hours">00</span>
        </div>
        <div class="label">Hours</div>
      </div>
      <div class="unit">
        <div class="temple-shape">
          <span class="num" id="minutes">00</span>
        </div>
        <div class="label">Minutes</div>
      </div>
      <div class="unit">
        <div class="temple-shape">
          <span class="num" id="seconds">00</span>
        </div>
        <div class="label">Seconds</div>
      </div>
    </div>

    <div class="target-date" id="targetLabel"></div>

    <button class="cta-btn" id="comingSoonBtn">Coming Soon</button>
  </div>
</div>

<script>
  function getTargetDate(){
    const now = new Date();
    let year = now.getFullYear();
    let target = new Date(year, 9, 14, 10, 30, 0); // October (0-indexed month)
    if(target.getTime() <= now.getTime()){
      target = new Date(year+1, 9, 14, 10, 30, 0);
    }
    return target;
  }

  const target = getTargetDate();
  document.getElementById('targetLabel').textContent =
    'Target: ' + target.toLocaleString(undefined, {
      weekday:'long', year:'numeric', month:'long', day:'numeric', hour:'2-digit', minute:'2-digit'
    });

  function pad(n){ return n.toString().padStart(2,'0'); }

  function update(){
    const now = new Date();
    let diff = target - now;
    if(diff <= 0){
      document.getElementById('timer').innerHTML = '<div class="done">The moment has arrived 🔥</div>';
      clearInterval(interval);
      return;
    }
    const days = Math.floor(diff / (1000*60*60*24));
    diff -= days * (1000*60*60*24);
    const hours = Math.floor(diff / (1000*60*60));
    diff -= hours * (1000*60*60);
    const minutes = Math.floor(diff / (1000*60));
    diff -= minutes * (1000*60);
    const seconds = Math.floor(diff / 1000);

    document.getElementById('days').textContent = pad(days);
    document.getElementById('hours').textContent = pad(hours);
    document.getElementById('minutes').textContent = pad(minutes);
    document.getElementById('seconds').textContent = pad(seconds);
  }

  update();
  const interval = setInterval(update, 1000);

  document.getElementById('comingSoonBtn').addEventListener('click', function(){
    this.textContent = 'Stay Tuned!';
    setTimeout(()=>{ this.textContent = 'Coming Soon'; }, 1500);
  });
</script>

</body>
</html>
