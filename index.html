<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Countdown to October 14</title>
<style>
  :root{
    --flame1:#ff6a00;
    --flame2:#ffb347;
    --flame3:#ff2e63;
    --bg1:#0b0518;
    --bg2:#1a0b2e;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    height:100%;
    overflow:hidden;
    font-family:'Segoe UI', Arial, sans-serif;
    background:radial-gradient(ellipse at 50% 30%, var(--bg2), var(--bg1) 70%);
  }
  .sky{
    position:fixed;
    inset:0;
    overflow:hidden;
  }
  .star{
    position:absolute;
    background:#fff;
    border-radius:50%;
    opacity:.7;
    animation:twinkle 3s infinite ease-in-out;
  }
  @keyframes twinkle{
    0%,100%{opacity:.2;}
    50%{opacity:1;}
  }
  .ember{
    position:absolute;
    bottom:-10px;
    border-radius:50%;
    background:radial-gradient(circle, var(--flame2), var(--flame1));
    opacity:.8;
    animation:rise linear infinite;
    filter: blur(0.5px);
  }
  @keyframes rise{
    0%{transform:translateY(0) translateX(0); opacity:.9;}
    100%{transform:translateY(-110vh) translateX(20px); opacity:0;}
  }

  .phoenix-wrap{
    position:absolute;
    top:20%;
    left:-300px;
    width:220px;
    height:160px;
    animation:fly 16s linear infinite;
    filter: drop-shadow(0 0 25px var(--flame1)) drop-shadow(0 0 45px var(--flame3));
  }
  @keyframes fly{
    0%{ left:-300px; top:60%; transform:scale(0.8) rotate(-3deg);}
    25%{ top:25%; transform:scale(1) rotate(2deg);}
    50%{ top:45%; transform:scale(1.1) rotate(-2deg);}
    75%{ top:15%; transform:scale(0.95) rotate(3deg);}
    100%{ left:110%; top:35%; transform:scale(0.8) rotate(-3deg);}
  }
  .wing{
    transform-origin: 100px 60px;
    animation: flap 0.5s ease-in-out infinite alternate;
  }
  .wing.right{
    transform-origin: 100px 60px;
    animation: flapR 0.5s ease-in-out infinite alternate;
  }
  @keyframes flap{
    0%{transform:rotate(-18deg) scaleY(1);}
    100%{transform:rotate(10deg) scaleY(0.9);}
  }
  @keyframes flapR{
    0%{transform:rotate(18deg) scaleY(1);}
    100%{transform:rotate(-10deg) scaleY(0.9);}
  }
  .tailflame{
    animation: flicker 0.4s ease-in-out infinite alternate;
    transform-origin: 40px 80px;
  }
  @keyframes flicker{
    0%{opacity:.85; transform:scale(1) translateX(0);}
    100%{opacity:1; transform:scale(1.08) translateX(-4px);}
  }

  .content{
    position:relative;
    z-index:5;
    height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:#fff8f0;
    padding:20px;
  }
  h1{
    font-size:clamp(1.6rem, 4vw, 2.8rem);
    letter-spacing:2px;
    text-transform:uppercase;
    margin-bottom:.3em;
    background:linear-gradient(90deg, var(--flame2), var(--flame3), var(--flame1));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    text-shadow: 0 0 30px rgba(255,106,0,.3);
  }
  .subtitle{
    color:#d8c8e8;
    margin-bottom:2em;
    font-size:clamp(0.9rem,2vw,1.1rem);
    letter-spacing:1px;
  }
  .timer{
    display:flex;
    gap:clamp(10px,3vw,30px);
    flex-wrap:wrap;
    justify-content:center;
  }
  .unit{
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,150,60,0.35);
    backdrop-filter: blur(6px);
    border-radius:16px;
    padding:18px clamp(14px,3vw,28px);
    min-width:90px;
    box-shadow: 0 0 25px rgba(255,80,0,0.15), inset 0 0 15px rgba(255,120,0,0.08);
  }
  .unit .num{
    font-size:clamp(1.8rem,5vw,3rem);
    font-weight:700;
    color:#ffdfba;
    text-shadow:0 0 15px rgba(255,140,0,0.6);
    font-variant-numeric: tabular-nums;
  }
  .unit .label{
    margin-top:6px;
    font-size:.75rem;
    letter-spacing:2px;
    text-transform:uppercase;
    color:#c9a8d6;
  }
  .target-date{
    margin-top:2em;
    font-size:.95rem;
    color:#f0c9a0;
    letter-spacing:1px;
  }
  .done{
    font-size:clamp(1.5rem,4vw,2.5rem);
    color:#ffdfba;
    text-shadow:0 0 30px var(--flame1);
  }
</style>
</head>
<body>

<div class="sky" id="sky"></div>

<div class="phoenix-wrap" id="phoenix">
  <svg viewBox="0 0 200 140" width="220" height="160">
    <defs>
      <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#ffd27a"/>
        <stop offset="50%" stop-color="#ff8a2b"/>
        <stop offset="100%" stop-color="#ff2e63"/>
      </linearGradient>
      <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#ffdca0"/>
        <stop offset="40%" stop-color="#ff8a2b"/>
        <stop offset="100%" stop-color="#d81159"/>
      </linearGradient>
      <linearGradient id="flameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#ff2e63" stop-opacity="0"/>
        <stop offset="60%" stop-color="#ff6a00"/>
        <stop offset="100%" stop-color="#ffd27a"/>
      </linearGradient>
    </defs>

    <!-- tail flame -->
    <g class="tailflame">
      <path d="M60,70 C30,60 10,75 2,80 C15,82 30,88 45,92 C25,95 10,105 5,112 C25,110 45,108 62,98 Z" fill="url(#flameGrad)"/>
    </g>

    <!-- left wing -->
    <g class="wing">
      <path d="M100,60 C70,40 40,20 15,25 C35,35 45,50 55,65 C35,60 15,62 5,70 C30,75 50,85 70,88 C55,90 40,95 32,102 C55,100 78,92 100,75 Z" fill="url(#wingGrad)"/>
    </g>

    <!-- right wing -->
    <g class="wing right">
      <path d="M100,60 C130,40 160,20 185,25 C165,35 155,50 145,65 C165,60 185,62 195,70 C170,75 150,85 130,88 C145,90 160,95 168,102 C145,100 122,92 100,75 Z" fill="url(#wingGrad)"/>
    </g>

    <!-- body -->
    <ellipse cx="105" cy="65" rx="22" ry="14" fill="url(#bodyGrad)"/>
    <!-- neck -->
    <path d="M120,58 C132,50 142,42 148,32" stroke="url(#bodyGrad)" stroke-width="10" fill="none" stroke-linecap="round"/>
    <!-- head -->
    <circle cx="151" cy="28" r="8" fill="url(#bodyGrad)"/>
    <!-- beak -->
    <path d="M158,27 L168,25 L158,32 Z" fill="#ffdfba"/>
    <!-- crest -->
    <path d="M148,20 C150,12 154,6 160,3 C156,10 156,16 155,21 Z" fill="#ffd27a"/>
    <path d="M144,19 C144,10 146,4 150,0 C148,8 149,14 149,20 Z" fill="#ff8a2b"/>
    <!-- eye -->
    <circle cx="153" cy="27" r="1.6" fill="#3a0d0d"/>
  </svg>
</div>

<div class="content">
  <h1>Rise of the Moment</h1>
  <div class="subtitle">Countdown to October 14 &middot; 10:30 AM</div>
  <div class="timer" id="timer">
    <div class="unit"><div class="num" id="days">00</div><div class="label">Days</div></div>
    <div class="unit"><div class="num" id="hours">00</div><div class="label">Hours</div></div>
    <div class="unit"><div class="num" id="minutes">00</div><div class="label">Minutes</div></div>
    <div class="unit"><div class="num" id="seconds">00</div><div class="label">Seconds</div></div>
  </div>
  <div class="target-date" id="targetLabel"></div>
</div>

<script>
  // Build the starfield
  const sky = document.getElementById('sky');
  const starCount = 80;
  for(let i=0;i<starCount;i++){
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random()*2 + 1;
    s.style.width = size+'px';
    s.style.height = size+'px';
    s.style.left = Math.random()*100+'vw';
    s.style.top = Math.random()*100+'vh';
    s.style.animationDelay = (Math.random()*3)+'s';
    sky.appendChild(s);
  }
  // Embers rising
  const emberCount = 25;
  for(let i=0;i<emberCount;i++){
    const e = document.createElement('div');
    e.className = 'ember';
    const size = Math.random()*4 + 2;
    e.style.width = size+'px';
    e.style.height = size+'px';
    e.style.left = Math.random()*100+'vw';
    e.style.animationDuration = (Math.random()*6+5)+'s';
    e.style.animationDelay = (Math.random()*6)+'s';
    sky.appendChild(e);
  }

  // Determine next Oct 14 10:30 AM (local time)
  function getTargetDate(){
    const now = new Date();
    let year = now.getFullYear();
    let target = new Date(year, 9, 14, 10, 30, 0); // month is 0-indexed: 9 = October
    if(target.getTime() <= now.getTime()){
      target = new Date(year+1, 9, 14, 10, 30, 0);
    }
    return target;
  }

  const target = getTargetDate();
  document.getElementById('targetLabel').textContent =
    'Target: ' + target.toLocaleString(undefined, {
      weekday:'long', year:'numeric', month:'long', day:'numeric', hour:'2-digit', minute:'2-digit'
    });

  function pad(n){ return n.toString().padStart(2,'0'); }

  function update(){
    const now = new Date();
    let diff = target - now;
    if(diff <= 0){
      document.getElementById('timer').innerHTML = '<div class="done">The moment has arrived 🔥</div>';
      clearInterval(interval);
      return;
    }
    const days = Math.floor(diff / (1000*60*60*24));
    diff -= days * (1000*60*60*24);
    const hours = Math.floor(diff / (1000*60*60));
    diff -= hours * (1000*60*60);
    const minutes = Math.floor(diff / (1000*60));
    diff -= minutes * (1000*60);
    const seconds = Math.floor(diff / 1000);

    document.getElementById('days').textContent = pad(days);
    document.getElementById('hours').textContent = pad(hours);
    document.getElementById('minutes').textContent = pad(minutes);
    document.getElementById('seconds').textContent = pad(seconds);
  }

  update();
  const interval = setInterval(update, 1000);
</script>

</body>
</html>
